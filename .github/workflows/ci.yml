name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the packed tarball
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/syscli-mytpe-*.tgz
          node -e "const m = require('@syscli/mytpe'); if (typeof m.Mytpe !== 'function') process.exit(1); console.log('cjs', m.VERSION)"
          node --input-type=module -e "const m = await import('@syscli/mytpe'); if (typeof m.Mytpe !== 'function') process.exit(1); console.log('esm', m.VERSION)"
